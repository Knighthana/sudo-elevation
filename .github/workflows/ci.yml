name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Pin the job token instead of inheriting the repository/org default, which an
# owner can widen at any time. The run log showed the default in effect as
# `Contents: read, Metadata: read, Packages: read`; this workflow only ever
# reads the tree, and the untrusted input is the PR's own code, so `packages:
# read` is dropped rather than carried along implicitly.
permissions:
  contents: read

# Superseded PR runs are cancelled — nobody is waiting on them and a full matrix
# is ~5 minutes. Pushes to master and tags are NOT cancelled: every push there
# is a deliberate act, minutes are free on a public repo, and cancelling would
# hide whether an earlier commit was already broken.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ubuntu-latest is intentionally unpinned: it exercises the newest Ubuntu
    # this project will actually meet in the wild, so upstream changes
    # (util-linux `script`, sudo, mawk) surface early instead of silently.
    # This is NOT a product support matrix — install.sh only requires
    # sudo >= 1.8.21 and is distro-agnostic.
    steps:
      # v5 runs on Node 24; v4 emitted a Node 20 deprecation warning. This is
      # the action's own runtime — the project itself is pure shell.
      # v7 is the current major (checked 2026-09-26) and would work equally
      # well, but it is not adopted here on purpose: the local CI harness
      # emulates checkout with a plain `git clone`, so no major bump can be
      # verified before it reaches GitHub. v5 is the smallest change that
      # removes the warning; revisit when the harness can exercise the action
      # itself, or when v5 hits its own Node deprecation.
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          shellcheck -S warning \
            install.sh \
            bin/sudo-elevation bin/sudo-askpass \
            libexec/sudo-elevation/grant libexec/sudo-elevation/restore \
            libexec/sudo-elevation/common.sh \
            tests/run-host.sh \
            tests/docker/run.sh tests/docker/lib.sh \
            tests/docker/fake-askpass tests/docker/fake-askpass-print \
            tests/docker/fake-askpass-kdialog tests/docker/stubs/kdialog \
            tests/docker/fake-askpass-kdialog-slow tests/docker/stubs-slow/kdialog \
            tests/docker/scenarios/*.sh \
            tests/manual/lock-tty.sh

      # Runner env notes (hosted ubuntu-latest): passwordless sudo, no tty for
      # the step, and actions/checkout exports XDG_CONFIG_HOME/HOME overrides
      # for global git config. run-host.sh neutralizes XDG_* itself; keep
      # `pipefail` here so a failing test aborts the step instead of being
      # masked by a later command, and echo the log tail on failure so the
      # cause is visible on the run page without downloading job logs.
      # No per-step timing echo: the Actions API already reports step
      # durations, and run.sh prints its own build/scenario ledger for the
      # sub-step breakdown the step view cannot show.
      - name: Host sandbox tests
        run: |
          set -o pipefail
          ./tests/run-host.sh 2>&1 | tee host-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::host tests failed (rc=$rc) - last 40 lines:"
            tail -n 40 host-tests.log
          fi
          exit "$rc"

      - name: Docker matrix (Ubuntu 24.04 + Debian 12)
        run: |
          set -o pipefail
          tests/docker/run.sh 2>&1 | tee docker-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::docker matrix failed (rc=$rc) - last 40 lines:"
            tail -n 40 docker-tests.log
          fi
          exit "$rc"
